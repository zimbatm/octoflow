openapi: 3.1.0
info:
  title: Octoflow SSE API
  version: 0.1.0
  description: |
    Server-Sent Events for GitHub events stored in JetStream. Every route
    streams `text/event-stream`. Each event is a named SSE event whose
    `event` field is the GitHub event type, whose `id` is the JetStream
    stream sequence, and whose `data` is a `GitHubEvent` JSON document.

servers:
  - url: http://localhost:8080
    description: Local SSE server

paths:
  /events:
    get:
      summary: Stream every event once
      description: Reads the primary subjects, so fan-out copies are not repeated.
      operationId: streamAllEvents
      parameters:
        - $ref: '#/components/parameters/Last'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/Payload'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          $ref: '#/components/responses/SSEStream'
        '400':
          $ref: '#/components/responses/BadRequest'

  /events/org/{org_id}:
    get:
      summary: Events of one organization
      operationId: streamOrgEvents
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/Last'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/Payload'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          $ref: '#/components/responses/SSEStream'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: The id is not numeric

  /events/repo/{repo_id}:
    get:
      summary: Events of one repository
      operationId: streamRepoEvents
      parameters:
        - $ref: '#/components/parameters/RepoID'
        - $ref: '#/components/parameters/Last'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/Payload'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          $ref: '#/components/responses/SSEStream'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: The id is not numeric

  /events/user/{user_id}:
    get:
      summary: Events involving one user, as sender, author, assignee or reviewer
      operationId: streamUserEvents
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d+$'
        - $ref: '#/components/parameters/Last'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/Payload'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          $ref: '#/components/responses/SSEStream'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: The id is not numeric

  /events/pr/{repo_id}/{number}:
    get:
      summary: Events of one pull request
      operationId: streamPREvents
      parameters:
        - $ref: '#/components/parameters/RepoID'
        - $ref: '#/components/parameters/Number'
        - $ref: '#/components/parameters/Last'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/Payload'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          $ref: '#/components/responses/SSEStream'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: An id is not numeric

  /events/issue/{repo_id}/{number}:
    get:
      summary: Events of one issue
      operationId: streamIssueEvents
      parameters:
        - $ref: '#/components/parameters/RepoID'
        - $ref: '#/components/parameters/Number'
        - $ref: '#/components/parameters/Last'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/Payload'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          $ref: '#/components/responses/SSEStream'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: An id is not numeric

  /events/type/{event_type}:
    get:
      summary: One event type across every organization
      operationId: streamTypeEvents
      parameters:
        - name: event_type
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z_]+$'
            example: pull_request
        - $ref: '#/components/parameters/Last'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/Payload'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          $ref: '#/components/responses/SSEStream'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: The type is not lower-case letters and underscores

  /stats:
    get:
      summary: Open SSE connections and stored events
      operationId: getStats
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'

  /health:
    get:
      summary: Liveness
      operationId: health
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy

components:
  parameters:
    OrgID:
      name: org_id
      in: path
      required: true
      description: Numeric organization id
      schema:
        type: string
        pattern: '^\d+$'
        example: "487568"
    RepoID:
      name: repo_id
      in: path
      required: true
      description: Numeric repository id
      schema:
        type: string
        pattern: '^\d+$'
        example: "4542716"
    Number:
      name: number
      in: path
      required: true
      description: Pull request or issue number
      schema:
        type: string
        pattern: '^\d+$'
    Last:
      name: last
      in: query
      description: |
        Replay the last N events of the route and of `type` before
        streaming new ones. 0 means none, the default is 50, the maximum
        1000. Ignored when Last-Event-ID or `since` is sent.
      schema:
        type: integer
        minimum: 0
        maximum: 1000
        default: 50
    Since:
      name: since
      in: query
      description: |
        Replay from a time before streaming new ones: an RFC 3339 time, or
        a duration back from now such as `90m`, `36h` or `2d`. Not capped;
        a long range streams a lot of data. Ignored when Last-Event-ID is
        sent.
      schema:
        type: string
      examples:
        duration:
          value: "90m"
        time:
          value: "2026-11-22T08:00:00Z"
    Type:
      name: type
      in: query
      description: |
        Comma-separated GitHub event types to read, at most 100. Each type
        takes the place of the last wildcard of the route's subjects, so
        `last` counts only events of these types. On
        `/events/type/{event_type}` the list must contain the type of the
        route and changes nothing.
      schema:
        type: string
        pattern: '^[a-z_]+(,[a-z_]+)*$'
        example: "push,pull_request"
    Action:
      name: action
      in: query
      description: |
        Comma-separated actions to keep. A filter after delivery: `last`
        also counts the events that it drops.
      schema:
        type: string
        example: "opened,closed"
    Payload:
      name: payload
      in: query
      description: |
        `none` sends each event without its `payload` field. An event is
        13 to 30 kB, of which the other fields are a few hundred bytes.
        Without the parameter the stored event is sent unchanged.
      schema:
        type: string
        enum: [none]
    LastEventID:
      name: Last-Event-ID
      in: header
      description: |
        The `id` of the last event received, a JetStream stream sequence.
        Browsers send it on reconnect; the stream resumes after it. Not
        capped: every later event of the subjects follows. An id older
        than the stream starts at its first message.
      schema:
        type: string
        example: "1842"

  responses:
    BadRequest:
      description: A query parameter has a bad value; the body says which
      content:
        text/plain:
          schema:
            type: string
            example: 'type: "Push" is not an event type; give lower-case letters and underscores, with commas between types'
    SSEStream:
      description: SSE stream established
      headers:
        Content-Type:
          schema:
            type: string
            enum: ['text/event-stream']
        Access-Control-Allow-Origin:
          schema:
            type: string
            enum: ['*']
      content:
        text/event-stream:
          schema:
            type: string
            description: |
              The stream starts with `retry: 5000` and a `connected` event,
              then one unnamed event per GitHub event (the type is in the
              data), and a `: heartbeat`
              comment every 30 seconds while idle. An `error` event ends the
              stream when the server could not read from JetStream.
          examples:
            connected:
              value: |
                retry: 5000

                event: connected
                data: {"status":"connected","stream_id":"org-487568","subjects":"github.events.org.487568.>"}

            pull_request:
              value: |
                id: 1842
                data: {"id":"3fa3a85c-6a48-11f0-8793-19d640392600","event":"pull_request","action":"opened","received_at":"2026-10-14T12:00:00Z","repository":"NixOS/nixpkgs","repository_id":"4542716","organization":"NixOS","organization_id":"487568","sender":"zimbatm","sender_id":"2","payload":{}}

  schemas:
    GitHubEvent:
      type: object
      description: The stored event, as published by the webhook receiver or public-ingest.
      required: [id, event, received_at]
      properties:
        id:
          type: string
          description: GitHub delivery id, or gh-event-<id> for public-ingest
        event:
          type: string
          description: GitHub event type
          example: pull_request
        action:
          type: string
        hook_id:
          type: string
        hook_installation:
          type: string
        received_at:
          type: string
          format: date-time
        repository:
          type: string
          description: owner/name
        repository_id:
          type: string
        organization:
          type: string
        organization_id:
          type: string
        sender:
          type: string
        sender_id:
          type: string
        payload:
          type: object
          description: The raw GitHub webhook payload; absent only with `payload=none`
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Only on public-ingest events; source, github_event_id, created_at

    Stats:
      type: object
      properties:
        total_clients:
          type: integer
          description: Open SSE connections of this process
        events_stored:
          type: integer
          description: Events in the stream, without the fan-out copies; refreshed every 30 seconds, absent when the stream does not answer
        stored_since:
          type: string
          format: date-time
          description: Store time of the oldest message in the stream
      example:
        total_clients: 3
        events_stored: 181204
        stored_since: "2026-11-14T15:31:24Z"
