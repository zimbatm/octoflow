openapi: 3.1.0
info:
  title: Octoflow SSE API
  version: 0.1.0
  description: |
    Server-Sent Events for GitHub events stored in JetStream. Every route
    streams `text/event-stream`. Each event is a named SSE event whose
    `event` field is the GitHub event type, whose `id` is the JetStream
    stream sequence, and whose `data` is a `GitHubEvent` JSON document.

servers:
  - url: http://localhost:8080
    description: Local SSE server

paths:
  /events:
    get:
      summary: Stream every event once
      description: Reads the primary subjects, so fan-out copies are not repeated.
      operationId: streamAllEvents
      parameters:
        - $ref: '#/components/parameters/Last'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          $ref: '#/components/responses/SSEStream'

  /events/org/{org_id}:
    get:
      summary: Events of one organization
      operationId: streamOrgEvents
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/Last'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          $ref: '#/components/responses/SSEStream'
        '404':
          description: The id is not numeric

  /events/repo/{repo_id}:
    get:
      summary: Events of one repository
      operationId: streamRepoEvents
      parameters:
        - $ref: '#/components/parameters/RepoID'
        - $ref: '#/components/parameters/Last'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          $ref: '#/components/responses/SSEStream'
        '404':
          description: The id is not numeric

  /events/user/{user_id}:
    get:
      summary: Events involving one user, as sender, author, assignee or reviewer
      operationId: streamUserEvents
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d+$'
        - $ref: '#/components/parameters/Last'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          $ref: '#/components/responses/SSEStream'
        '404':
          description: The id is not numeric

  /events/pr/{repo_id}/{number}:
    get:
      summary: Events of one pull request
      operationId: streamPREvents
      parameters:
        - $ref: '#/components/parameters/RepoID'
        - $ref: '#/components/parameters/Number'
        - $ref: '#/components/parameters/Last'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          $ref: '#/components/responses/SSEStream'
        '404':
          description: An id is not numeric

  /events/issue/{repo_id}/{number}:
    get:
      summary: Events of one issue
      operationId: streamIssueEvents
      parameters:
        - $ref: '#/components/parameters/RepoID'
        - $ref: '#/components/parameters/Number'
        - $ref: '#/components/parameters/Last'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          $ref: '#/components/responses/SSEStream'
        '404':
          description: An id is not numeric

  /events/type/{event_type}:
    get:
      summary: One event type across every organization
      operationId: streamTypeEvents
      parameters:
        - name: event_type
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z_]+$'
            example: pull_request
        - $ref: '#/components/parameters/Last'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          $ref: '#/components/responses/SSEStream'
        '404':
          description: The type is not lower-case letters and underscores

  /stats:
    get:
      summary: Open SSE connections
      operationId: getStats
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'

  /health:
    get:
      summary: Liveness
      operationId: health
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy

components:
  parameters:
    OrgID:
      name: org_id
      in: path
      required: true
      description: Numeric organization id
      schema:
        type: string
        pattern: '^\d+$'
        example: "487568"
    RepoID:
      name: repo_id
      in: path
      required: true
      description: Numeric repository id
      schema:
        type: string
        pattern: '^\d+$'
        example: "4542716"
    Number:
      name: number
      in: path
      required: true
      description: Pull request or issue number
      schema:
        type: string
        pattern: '^\d+$'
    Last:
      name: last
      in: query
      description: |
        Replay the last N matching events before streaming new ones. 0 means
        none, the default is 50, the maximum 1000. Ignored when
        Last-Event-ID is sent.
      schema:
        type: integer
        minimum: 0
        maximum: 1000
        default: 50
    Type:
      name: type
      in: query
      description: Comma-separated GitHub event types to keep
      schema:
        type: string
        example: "push,pull_request"
    Action:
      name: action
      in: query
      description: Comma-separated actions to keep
      schema:
        type: string
        example: "opened,closed"
    LastEventID:
      name: Last-Event-ID
      in: header
      description: |
        The `id` of the last event received, a JetStream stream sequence.
        Browsers send it on reconnect; the stream resumes after it.
      schema:
        type: string
        example: "1842"

  responses:
    SSEStream:
      description: SSE stream established
      headers:
        Content-Type:
          schema:
            type: string
            enum: ['text/event-stream']
        Access-Control-Allow-Origin:
          schema:
            type: string
            enum: ['*']
      content:
        text/event-stream:
          schema:
            type: string
            description: |
              The stream starts with `retry: 5000` and a `connected` event,
              then one named event per GitHub event, and a `: heartbeat`
              comment every 30 seconds while idle. An `error` event ends the
              stream when the server could not read from JetStream.
          examples:
            connected:
              value: |
                retry: 5000

                event: connected
                data: {"status":"connected","stream_id":"org-487568","subjects":"github.events.org.487568.>"}

            pull_request:
              value: |
                id: 1842
                event: pull_request
                data: {"id":"3fa3a85c-6a48-11f0-8793-19d640392600","event":"pull_request","action":"opened","received_at":"2026-10-14T12:00:00Z","repository":"NixOS/nixpkgs","repository_id":"4542716","organization":"NixOS","organization_id":"487568","sender":"zimbatm","sender_id":"2","payload":{}}

  schemas:
    GitHubEvent:
      type: object
      description: The stored event, as published by the webhook receiver or public-ingest.
      required: [id, event, received_at, payload]
      properties:
        id:
          type: string
          description: GitHub delivery id, or gh-event-<id> for public-ingest
        event:
          type: string
          description: GitHub event type
          example: pull_request
        action:
          type: string
        hook_id:
          type: string
        hook_installation:
          type: string
        received_at:
          type: string
          format: date-time
        repository:
          type: string
          description: owner/name
        repository_id:
          type: string
        organization:
          type: string
        organization_id:
          type: string
        sender:
          type: string
        sender_id:
          type: string
        payload:
          type: object
          description: The raw GitHub webhook payload
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Only on public-ingest events; source, github_event_id, created_at

    Stats:
      type: object
      properties:
        total_clients:
          type: integer
          description: Open SSE connections of this process
      example:
        total_clients: 3
